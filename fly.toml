# Deploy: fly launch --no-deploy --copy-config && fly volumes create santa_data --size 1 && fly deploy
app = "secret-santa-CAMBIAMI"
primary_region = "mad"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/santa.db"

[mounts]
  source = "santa_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
