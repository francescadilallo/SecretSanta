name = "secret-santa"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# Interfaccia (PWA) servita da Cloudflare; il Worker risponde solo a /api/*.
# Le pagine tipo /g/CODICE ricadono su index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Database D1 (gratis). Senza database_id lo crea Cloudflare al primo deploy;
# le tabelle le crea il Worker da solo al primo utilizzo.
[[d1_databases]]
binding = "DB"
database_name = "secret-santa"

[observability]
enabled = true
